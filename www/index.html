<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <title>Manzanares Stereo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .player-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      max-width: 400px;
      width: 100%;
    }

    .logo-container {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }

    .logo-container.playing {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
      50% { transform: scale(1.05); box-shadow: 0 15px 50px rgba(0, 128, 0, 0.4); }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .station-info {
      text-align: center;
    }

    .station-name {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .station-status {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .station-status.live {
      color: #4ade80;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .play-button {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(145deg, #2e8b57, #3cb371);
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 20px rgba(46, 139, 87, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      padding: 0;
    }

    .play-button svg {
      width: 32px;
      height: 32px;
      fill: white;
    }

    .play-button .play-icon {
      margin-left: 4px;
    }

    .play-button .pause-icon {
      display: none;
    }

    .play-button.playing .play-icon {
      display: none;
    }

    .play-button.playing .pause-icon {
      display: block;
    }

    .play-button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 25px rgba(46, 139, 87, 0.5);
    }

    .play-button:active {
      transform: scale(0.95);
    }

    .play-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .volume-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      max-width: 280px;
      padding: 0 10px;
    }

    .volume-icon {
      font-size: 20px;
      opacity: 0.8;
    }

    .volume-slider {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2e8b57;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(46, 139, 87, 0.4);
    }

    .volume-slider::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #2e8b57;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 10px rgba(46, 139, 87, 0.4);
    }

    .visualizer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 40px;
    }

    .bar {
      width: 4px;
      background: linear-gradient(to top, #2e8b57, #3cb371);
      border-radius: 2px;
      transition: height 0.1s ease;
    }

    .visualizer.active .bar {
      animation: equalize 0.8s ease-in-out infinite;
    }

    .bar:nth-child(1) { animation-delay: 0s; }
    .bar:nth-child(2) { animation-delay: 0.1s; }
    .bar:nth-child(3) { animation-delay: 0.2s; }
    .bar:nth-child(4) { animation-delay: 0.3s; }
    .bar:nth-child(5) { animation-delay: 0.4s; }

    @keyframes equalize {
      0%, 100% { height: 8px; }
      50% { height: 32px; }
    }

    .visualizer:not(.active) .bar {
      height: 8px;
    }
  </style>
</head>
<body>
  <div class="player-container">
    <div class="logo-container" id="logoContainer">
      <img src="logo.png" alt="Manzanares Stereo" class="logo-img">
    </div>

    <div class="station-info">
      <h1 class="station-name">Manzanares Stereo</h1>
      <p class="station-status" id="stationStatus">Detenido</p>
    </div>

    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

    <div class="controls">
      <button class="play-button" id="playButton" aria-label="Reproducir">
        <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        <svg class="pause-icon" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
    </div>

    <div class="volume-container">
      <span class="volume-icon">🔈</span>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80">
      <span class="volume-icon">🔊</span>
    </div>
  </div>

  <audio id="radioPlayer" preload="none">
    <source src="https://radiolatina.info/7408/stream" type="audio/mpeg">
  </audio>

  <script>
    const audio = document.getElementById('radioPlayer');
    const playButton = document.getElementById('playButton');
    const volumeSlider = document.getElementById('volumeSlider');
    const stationStatus = document.getElementById('stationStatus');
    const visualizer = document.getElementById('visualizer');
    const logoContainer = document.getElementById('logoContainer');

    let isPlaying = false;

    // Set initial volume
    audio.volume = volumeSlider.value / 100;

    playButton.addEventListener('click', togglePlay);

    function togglePlay() {
      if (isPlaying) {
        audio.pause();
        audio.src = '';
        updateUI(false);
      } else {
        audio.src = 'https://radiolatina.info/7408/stream';
        audio.load();
        audio.play().catch(handleError);
        stationStatus.textContent = 'Conectando...';
        playButton.disabled = true;
      }
    }

    function updateUI(playing) {
      isPlaying = playing;
      playButton.disabled = false;

      if (playing) {
        playButton.classList.add('playing');
        stationStatus.textContent = 'En Vivo';
        stationStatus.classList.add('live');
        visualizer.classList.add('active');
        logoContainer.classList.add('playing');
      } else {
        playButton.classList.remove('playing');
        stationStatus.textContent = 'Detenido';
        stationStatus.classList.remove('live');
        visualizer.classList.remove('active');
        logoContainer.classList.remove('playing');
      }
    }

    function handleError(error) {
      console.error('Error playing audio:', error);
      stationStatus.textContent = 'Error de conexión';
      playButton.disabled = false;
      updateUI(false);
    }

    audio.addEventListener('playing', () => updateUI(true));
    audio.addEventListener('pause', () => updateUI(false));
    audio.addEventListener('ended', () => updateUI(false));
    audio.addEventListener('error', handleError);

    volumeSlider.addEventListener('input', (e) => {
      audio.volume = e.target.value / 100;
    });
  </script>
</body>
</html>
